services:
  db:
    profiles:
      - disabled

  minio:
    profiles:
      - disabled

  backend:
    env_file:
      - ./backend/.envs/.prod
    depends_on:
      redis:
        condition: service_healthy

  celery-worker:
    env_file:
      - ./backend/.envs/.prod
    depends_on:
      redis:
        condition: service_healthy

  celery-beat:
    env_file:
      - ./backend/.envs/.prod
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      args:
        VITE_SERVER_BASE_URL: "/api/v1"
        VITE_ENVIRONMENT: production

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/prod.conf:/etc/nginx/conf.d/default.conf
      - ./infra/certbot/www:/var/www/certbot
      - ./infra/certbot/conf:/etc/letsencrypt
      - ./backend/uploads:/uploads
      - ./backend/static:/static:ro

  certbot:
    image: certbot/certbot
    volumes:
      - ./infra/certbot/www:/var/www/certbot
      - ./infra/certbot/conf:/etc/letsencrypt
      - ./infra/scripts/certbot-deploy-hook.sh:/usr/local/bin/deploy-hook.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet --deploy-hook /usr/local/bin/deploy-hook.sh; sleep 12h; done'"
    restart: unless-stopped
    depends_on:
      - nginx
    mem_limit: 32m

volumes:
  postgres_data:
    name: clickmart_postgres_data
