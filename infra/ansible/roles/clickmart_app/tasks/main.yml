---
- name: Ensure app directory exists
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: deploy
    group: deploy
    mode: 0755

- name: Clone repository
  git:
    repo: "https://github.com/tawounfouet/yt_django-clickmart-devops.git"
    dest: "{{ app_dir }}"
    version: "{{ branch }}"
    force: yes
  become_user: deploy
  register: git_result

- name: Ensure .envs directory exists
  file:
    path: "{{ app_dir }}/backend/.envs"
    state: directory
    owner: deploy
    group: deploy
    mode: 0700

- name: Generate .env from template
  template:
    src: .env.prod.j2
    dest: "{{ app_dir }}/backend/.envs/.prod"
    owner: deploy
    group: deploy
    mode: 0600

- name: Pull latest images
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    files: "{{ compose_files }}"
    project_name: "{{ project_name }}"
    state: present
    pull: always
    build: never
  become_user: deploy
  register: compose_result

- name: Wait for containers to stabilize
  pause:
    seconds: 15

- name: Check container status
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    files: "{{ compose_files }}"
    project_name: "{{ project_name }}"
  become_user: deploy
  register: compose_ps

- name: Show running containers
  debug:
    var: compose_ps.containers | map(attribute='Name') | list
