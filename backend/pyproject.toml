[project]
name = "clickmart-backend"
version = "1.0.0"
description = "ClickMart e-commerce backend — Django 5.2 + DRF"
requires-python = ">=3.11"

dependencies = [
    "django>=5.2,<6.0",
    "django-cors-headers",
    "djangorestframework",
    "djangorestframework-simplejwt",
    "pillow",
    "psycopg2-binary",
    "PyJWT",
    "django-environ",
    "sqlparse",
    "gunicorn",
    "drf-spectacular",
    "celery",
    "redis",
    "django-storages[s3]",
    "boto3",
    "django-cloudinary-storage",
    "resend",
    "sentry-sdk[django]",
    "django-split-settings",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-django>=4.12",
    "pytest-cov>=7.1",
    "model-bakery>=1.24",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=9.1",
    "pytest-django>=4.12",
    "pytest-cov>=7.1",
    "model-bakery>=1.24",
    "ruff>=0.5",
]
