name: CI/CD Pipeline

on:
  push:
    branches: [main, stg, dev]
  pull_request:
    branches: [main, stg, dev]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/tawounfouet/clickmart-backend
  FRONTEND_IMAGE: ghcr.io/tawounfouet/clickmart-frontend

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install ruff coverage
      - name: Lint with ruff
        run: cd backend && ruff check . --ignore F401,E501,E402 || true
      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret-key-not-for-prod
          DEBUG: 'True'
          EMAIL_HOST_USER: test@test.com
          EMAIL_HOST_PASSWORD: test
          ALLOWED_HOSTS: localhost
          CORS_ALLOWED_ORIGINS: http://localhost:5173
        run: cd backend && python manage.py test --verbosity=2

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint || true
        working-directory: frontend
      - run: npx vitest run --config vite.config.js
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_SERVER_BASE_URL: /api/v1

  build-and-push:
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stg')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            VITE_SERVER_BASE_URL=/api/v1
            VITE_ENVIRONMENT=production
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: [build-and-push]
    if: github.ref == 'refs/heads/stg'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Staging to Linode
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LINODE_HOST }}
          username: ${{ secrets.LINODE_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          script: |
            set -e
            cd /opt/clickmart-stg
            git fetch origin stg && git reset --hard origin/stg
            docker compose -p clickmart-stg -f docker-compose.yml -f docker-compose.staging.yml pull
            docker compose -p clickmart-stg -f docker-compose.yml -f docker-compose.staging.yml up -d
            sleep 15
            docker compose -p clickmart-stg ps
            curl -sf http://localhost:8080/ || (echo "❌ Staging healthcheck failed" && exit 1)
            echo "✅ Staging deployment successful"

  deploy-production:
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Production to Linode
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LINODE_HOST }}
          username: ${{ secrets.LINODE_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          script: |
            set -e
            cd /opt/clickmart
            git fetch origin main && git reset --hard origin/main
            docker compose -p clickmart -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -p clickmart -f docker-compose.yml -f docker-compose.prod.yml up -d
            docker compose -p clickmart exec -T nginx nginx -s reload || true
            sleep 15
            docker compose -p clickmart ps
            curl -sf http://localhost/api/v1/products/ || (echo "❌ Backend healthcheck failed" && exit 1)
            curl -sf http://localhost/ || (echo "❌ Frontend healthcheck failed" && exit 1)
            echo "✅ Production deployment successful"
