name: CI/CD Pipeline

on:
  push:
    branches: [main, stg, dev]
  pull_request:
    branches: [main, stg, dev]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - production
          - staging
      tags:
        description: 'Ansible tags (comma-separated: docker, app, ssl, cicd)'
        required: false
        type: string
        default: 'docker'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/tawounfouet/clickmart-backend
  FRONTEND_IMAGE: ghcr.io/tawounfouet/clickmart-frontend

jobs:
  # ── Backend ──────────────────────────────────────────
  backend-lint:
    name: Backend — Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -r requirements.txt
          uv pip install --system ruff
      - name: Lint
        run: ruff check . --ignore F401,E501,E402,B017,BLE001,I001,RUF012,RUF100,S110 --exclude 'config/settings/'
      - name: Forbidden imports
        run: |
          ! grep -rn "from decouple\|import decouple\|python-decouple" . --include="*.py" \
            && echo "✅ No forbidden imports" \
            || (echo "❌ Forbidden import found: python-decouple was removed, use django-environ or os.environ" && exit 1)

  backend-test:
    name: Backend — Test
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install uv && uv pip install --system -r requirements.txt
      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret-key-not-for-prod
          DEBUG: 'True'
          EMAIL_HOST_USER: test@test.com
          EMAIL_HOST_PASSWORD: test
          ALLOWED_HOSTS: localhost
          CORS_ALLOWED_ORIGINS: http://localhost:5173
        run: python -m pytest -q

  # ── Frontend ─────────────────────────────────────────
  frontend-lint:
    name: Frontend — Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  frontend-test:
    name: Frontend — Test
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vitest run --config vite.config.js

  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest
    needs: frontend-test
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_SERVER_BASE_URL: /api/v1

  # ── Docker build + push ─────────────────────────────
  build-and-push:
    name: Build & Push
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stg')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            VITE_SERVER_BASE_URL=/api/v1
            VITE_ENVIRONMENT=production
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy — Staging
    needs: [build-and-push]
    if: github.ref == 'refs/heads/stg'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LINODE_HOST }}
          username: ${{ secrets.LINODE_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          script: |
            cd /opt/clickmart-stg && git fetch origin stg && git reset --hard origin/stg
            bash /opt/clickmart-stg/infra/scripts/deploy-app.sh staging stg

  deploy-production:
    name: Deploy — Production
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LINODE_HOST }}
          username: ${{ secrets.LINODE_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          script: |
            cd /opt/clickmart && git fetch origin main && git reset --hard origin/main
            bash /opt/clickmart/infra/scripts/deploy-app.sh production main '${{ github.actor }}' '${{ secrets.GITHUB_TOKEN }}'

  # ── Ansible provision (manual trigger) ────────────────
  provision:
    name: Provision — ${{ inputs.target }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          pip install ansible
          ansible-galaxy collection install community.docker

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LINODE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Generate secrets.yml
        run: |
          cat > infra/ansible/group_vars/secrets.yml << 'EOF'
          secret_key: "${{ secrets.SECRET_KEY || 'provision-key-change-me' }}"
          db_password: "${{ secrets.DB_PASSWORD || 'changeme' }}"
          redis_password: "${{ secrets.REDIS_PASSWORD || 'changeme' }}"
          cloudinary_api_key: "${{ secrets.CLOUDINARY_API_KEY || 'changeme' }}"
          cloudinary_api_secret: "${{ secrets.CLOUDINARY_API_SECRET || 'changeme' }}"
          resend_api_key: "${{ secrets.RESEND_API_KEY || 'changeme' }}"
          github_user: "${{ github.actor }}"
          github_token: "${{ secrets.GITHUB_TOKEN }}"
          sentry_dsn: "${{ secrets.SENTRY_DSN || '' }}"
          EOF

      - name: Set target host
        id: target
        run: |
          if [ "${{ inputs.target }}" = "production" ]; then
            echo "host=clickmart-prod" >> $GITHUB_OUTPUT
          else
            echo "host=clickmart-staging" >> $GITHUB_OUTPUT
          fi

      - name: Run Ansible playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: false
        run: |
          ansible-playbook infra/ansible/deploy.yml \
            -i infra/ansible/inventory.yml \
            --limit ${{ steps.target.outputs.host }} \
            --tags "${{ inputs.tags }}" \
            -e "ansible_ssh_private_key_file=$HOME/.ssh/deploy_key"
