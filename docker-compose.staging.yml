services:
  db:
    env_file:
      - ./backend/.envs/.staging

  backend:
    env_file:
      - ./backend/.envs/.staging
    environment:
      - ENVIRONMENT=staging

  celery-worker:
    env_file:
      - ./backend/.envs/.staging
    environment:
      - ENVIRONMENT=staging

  celery-beat:
    env_file:
      - ./backend/.envs/.staging
    environment:
      - ENVIRONMENT=staging

  frontend:
    build:
      args:
        VITE_SERVER_BASE_URL: "/api/v1"
        VITE_ENVIRONMENT: staging

  nginx:
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/staging.conf:/etc/nginx/conf.d/default.conf
      - ./backend/media:/media
      - ./backend/static:/static:ro

volumes:
  postgres_data:
    name: staging_postgres_data
