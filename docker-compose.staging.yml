services:
  db:
    env_file:
      - ./backend/.env.staging

  backend:
    env_file:
      - ./backend/.env.staging
    environment:
      - ENVIRONMENT=staging

  celery-worker:
    env_file:
      - ./backend/.env.staging
    environment:
      - ENVIRONMENT=staging

  celery-beat:
    env_file:
      - ./backend/.env.staging
    environment:
      - ENVIRONMENT=staging

  nginx:
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/staging.conf:/etc/nginx/conf.d/default.conf

  certbot:
    profiles:
      - production

volumes:
  postgres_data:
    name: staging_postgres_data
